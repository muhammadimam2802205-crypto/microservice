services:
  review-service:
    build: .
    ports:
      - "3002:3002"
    environment:
      - HOST=0.0.0.0
      - PORT=3002
      - FLASK_DEBUG=1
      - MONGO_URI=mongodb://appuser:apppassword@review-db:27017/?authSource=admin
      - MONGO_DB_NAME=reviewdb
      - PRODUCT_SERVICE_URL=http://product-services:3000
    depends_on:
      review-db:
        condition: service_healthy
    networks:
      - default
      - product-network

  review-db:
    image: mongo:7
    environment:
      - MONGO_INITDB_ROOT_USERNAME=appuser
      - MONGO_INITDB_ROOT_PASSWORD=apppassword
    ports:
      - "27017:27017"
    volumes:
      - review-db-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      retries: 5
      start_period: 20s
      timeout: 5s

volumes:
  review-db-data:

networks:
  product-network:
    external: true
    name: mi-pdsku_default
